name: iOS CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    # The app is built with Xcode 26+ (local and Xcode Cloud use Xcode 27).
    # Xcode 16.4 / Swift 6.1 rejects code that newer compilers accept, so CI
    # must use the same generation of Xcode.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          def version(key):
              return [int(part) for part in key.split("iOS-")[1].split("-")]
          for runtime in sorted((k for k in devices if "iOS-" in k), key=version, reverse=True):
              phones = [d for d in devices[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  pro = [d for d in phones if "Pro" in d["name"]]
                  print((pro or phones)[0]["udid"])
                  break
          ')
          echo "Simulator: $UDID"
          test -n "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          xcodebuild test \
            -project BrightTime.xcodeproj \
            -scheme BrightTime \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO
